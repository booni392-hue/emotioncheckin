<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매일 마음 체크인 · 스마트올 (v10)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="tab" id="tab">
  <!-- 시작 화면: 스마트올 홈 -->
  <div class="home" id="home">
    <img src="assets/smartall-home.png" alt="스마트올 홈 화면">
    <div class="speech" onclick="startFromHome()">
      <div class="t1">너의 마음이 궁금해,<br>나에게 말해줘~</div>
      <div class="t2">여기를 눌러 시작하기 👆</div>
    </div>
    <button class="bot-hit" onclick="startFromHome()" aria-label="마음 체크인 시작"></button>
  </div>

  <div class="top">
    <button class="close" onclick="restart()">✕</button>
    <div class="logo"><span class="s">smart</span><span class="a">All</span><span class="tag">마음 체크인</span></div>
    <button class="snd" id="sndBtn" onclick="toggleSound()" title="소리 켜기/끄기">🔊</button>
    <span class="streak" id="streak">🔥 Day 1</span>
    <div class="dots" id="dots"></div>
  </div>

  <div class="stage" id="stage"><!-- injected --></div>

  <div class="bottom">
    <div class="nav">
      <button class="btn btn-ghost" id="prevBtn" onclick="prev()">이전</button>
      <button class="btn btn-primary" id="nextBtn" onclick="next()" disabled>다음</button>
    </div>
  </div>

  <div class="dayend" id="dayend">
    <div class="bgstar" style="top:8%;left:6%">★</div>
    <div class="bgstar" style="bottom:10%;right:8%;font-size:96px">★</div>
    <div class="k" id="deK">🚌 Day 1 완료!</div>
    <h1 id="deTitle">오늘도 마음 알려줘서<br>고마워 💛</h1>
    <div class="desub" id="deSub" style="display:none"></div>
    <div class="recall" id="deRecall" style="display:none"></div>
    <div class="deroute">
      <div class="derail"><div class="defill" id="deFill"></div><div class="debus" id="deBus">🚌</div></div>
      <div class="destop">🚏</div>
    </div>
    <div class="deprog" id="deProg"></div>
    <button class="cta" id="deBtn" onclick="startNextDay()">다음 날 →</button>
    <button class="small" onclick="openMapOverlay()">🗺️ 내 마음지도 보기</button>
    <button class="small" onclick="restart()">처음부터 다시 보기</button>
  </div>

  <!-- 하루 시작 인트로 -->
  <div class="dayintro" id="dayintro">
    <div class="bgstar" style="top:10%;left:7%">🚌</div>
    <div class="bgstar" style="bottom:12%;right:9%;font-size:96px">🚏</div>
    <div class="k" id="diK">🚌 Day 1</div>
    <h1 id="diTitle"></h1>
    <div class="disub" id="diSub"></div>
    <div class="deroute">
      <div class="derail"><div class="defill" id="diFill"></div><div class="debus" id="diBus">🚌</div></div>
      <div class="destop">🚏</div>
    </div>
    <div class="deprog" id="diProg"></div>
    <button class="cta" onclick="closeDayIntro()">여행 시작하기 →</button>
    <button class="small" onclick="openMapOverlay()">🗺️ 내 마음지도 먼저 보기</button>
  </div>

  <!-- 마음지도 전체보기 오버레이 -->
  <div class="mapov" id="mapOverlay">
    <div class="mapov-card">
      <button class="mapov-x" onclick="closeMapOverlay()">✕</button>
      <div id="mapovBody"></div>
    </div>
  </div>

  <div class="dmodal" id="dmodal" style="display:none" onclick="closeDayModal()"></div>
</div>

<!-- ===== 시연용 컨트롤러 (프로토타입 전용) ===== -->
<div class="demo-row">
<div class="demo" id="demoBar">
  <span class="lb">🎬 시연</span>
  <button class="go" onclick="demoJump('start')">순서대로 해보기<span class="kx">1</span></button>
  <button onclick="demoJump('map5')">Day 5 마음지도<span class="kx">2</span></button>
  <button onclick="demoJump('map9')">마지막 마음지도<span class="kx">3</span></button>
  <button class="fin" onclick="demoJump('finish')">FINISH 결과<span class="kx">4</span></button>
  <button class="x" onclick="demoToggle(false)" title="컨트롤러 숨기기">✕</button>
</div>
<button class="demo-open" id="demoOpen" onclick="demoToggle(true)">🎬 시연 컨트롤러</button>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
